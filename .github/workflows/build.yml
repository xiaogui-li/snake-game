name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer/android/platform
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-
    
    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          python3-pip \
          python3-venv \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          cmake \
          libffi-dev \
          libssl-dev \
          automake
    
    - name: Install Buildozer
      run: |
        python -m venv ~/venv
        source ~/venv/bin/activate
        pip install --upgrade pip
        pip install buildozer cython
        
    - name: Build APK
      run: |
        source ~/venv/bin/activate
        # Pre-accept all Android SDK licenses
        mkdir -p ~/.android
        echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.android/repositories.cfg
        # Set environment to auto-accept licenses
        export ANDROID_SDK_ROOT=~/.buildozer/android/platform/android-sdk
        yes | buildozer android debug || true
        # Try again
        buildozer android debug
      env:
        BUILDOZER_WARN_ON_ROOT: 0
        ANDROID_SDK_ROOT: ~/.buildozer/android/platform/android-sdk
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: snake-game-apk
        path: bin/*.apk
        retention-days: 30
    
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: bin/*.apk
        tag_name: v${{ github.run_number }}
        name: Snake Game v${{ github.run_number }}
        body: |
          贪吃蛇游戏 APK
          
          安装方法:
          1. 下载 APK 文件
          2. 允许"安装未知应用"
          3. 安装游玩!
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
