name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
        
    - name: Build with Docker
      run: |
        docker run --rm \
          -v "${PWD}:/app" \
          -w /app \
          -e BUILDOZER_WARN_ON_ROOT=1 \
          -e BUILDOZER_ALLOW_ROOT=1 \
          kivy/buildozer:latest \
          /bin/bash -c "export BUILDOZER_WARN_ON_ROOT=1 && export BUILDOZER_ALLOW_ROOT=1 && yes | buildozer android debug"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: snake-game-apk
        path: bin/*.apk
        retention-days: 30
    
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: bin/*.apk
        tag_name: v${{ github.run_number }}
        name: Snake Game v${{ github.run_number }}
        body: |
          贪吃蛇游戏 APK
          
          安装方法:
          1. 下载 APK 文件
          2. 允许"安装未知应用"
          3. 安装游玩!
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
